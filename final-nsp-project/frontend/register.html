<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">`n    <link rel="icon" type="image/png" href="favicon.png">
    <title>Create Account — Vellichor AI</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('vellichor_theme')||'dark');})()</script>
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <h1>Join Vellichor</h1>
                <p>Create your account and start exploring</p>
            </div>

            <div class="auth-error" id="registerError"></div>

            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="input" placeholder="Your name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input" placeholder="Create a strong password" required minlength="6">
                </div>

                <div class="input-group">
                    <label>Favorite Genres</label>
                    <p style="font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: var(--space-2);">Select genres that interest you</p>
                    <div class="genre-grid" id="genreGrid">
                        <div class="genre-chip" data-genre="Fantasy" onclick="toggleGenre(this)">Fantasy</div>
                        <div class="genre-chip" data-genre="Science Fiction" onclick="toggleGenre(this)">Sci-Fi</div>
                        <div class="genre-chip" data-genre="Romance" onclick="toggleGenre(this)">Romance</div>
                        <div class="genre-chip" data-genre="Mystery" onclick="toggleGenre(this)">Mystery</div>
                        <div class="genre-chip" data-genre="Thriller" onclick="toggleGenre(this)">Thriller</div>
                        <div class="genre-chip" data-genre="Historical Fiction" onclick="toggleGenre(this)">Historical</div>
                        <div class="genre-chip" data-genre="Literary Fiction" onclick="toggleGenre(this)">Literary</div>
                        <div class="genre-chip" data-genre="Horror" onclick="toggleGenre(this)">Horror</div>
                        <div class="genre-chip" data-genre="Non-Fiction" onclick="toggleGenre(this)">Non-Fiction</div>
                        <div class="genre-chip" data-genre="Poetry" onclick="toggleGenre(this)">Poetry</div>
                        <div class="genre-chip" data-genre="Mythology" onclick="toggleGenre(this)">Mythology</div>
                        <div class="genre-chip" data-genre="Biography" onclick="toggleGenre(this)">Biography</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="registerBtn" style="width: 100%;">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
