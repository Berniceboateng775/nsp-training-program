<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <script>(function(){var t='dark';try{t=localStorage.getItem('vellichor_theme')||'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t);})()</script>
    <style>html{background:#100e0c;color-scheme:dark}html[data-theme="light"]{background:#f6f1e9;color-scheme:light}@view-transition{navigation:auto}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400..700&display=swap">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Book Chat — Vellichor</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <div class="app-layout">
        <div class="main-content" id="mainContent">
            <header class="page-header">
                <h1>Book Chat</h1>
                <span class="server-status" id="serverStatus" hidden></span>
            </header>

            <div class="chat-container">
                <!-- Suggestions (shown when no messages) -->
                <div class="chat-suggestions" id="chatSuggestions">
                    <div class="suggestions-header">
                        <h2>What's on your <em>reading mind?</em></h2>
                        <p>Ask about a book, a character, a plot hole, or what to read next.</p>
                    </div>
                    <div class="suggestions-grid">
                        <button class="suggestion-btn" onclick="sendSuggestion('Recommend me a book that feels like a warm hug but also makes me cry a little')">
                            <span class="suggestion-kicker">Recommend</span>
                            A book that feels like a hug but still makes me cry
                        </button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Was Gatsby actually in love with Daisy, or just obsessed with an idea of her?')">
                            <span class="suggestion-kicker">Debate</span>
                            Was Gatsby in love, or just obsessed?
                        </button>
                        <button class="suggestion-btn" onclick="sendSuggestion('What emotions does this line carry: 'I kept the letter for three years. I never opened it.'')">
                            <span class="suggestion-kicker">Feel it</span>
                            What does this line make you feel?
                        </button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Explain the ending of Never Let Me Go without being boring about it')">
                            <span class="suggestion-kicker">Explain</span>
                            The ending of <i>Never Let Me Go</i>, without the boring bits
                        </button>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-messages" id="chatMessages" style="display: none;">
                    <!-- Typing Indicator lives at the end of the thread -->
                </div>

                <!-- Input -->
                <div class="chat-input-area">
                    <div class="chat-file-info" id="chatFileInfo" style="display: none;">
                        <span id="chatFileName"></span>
                        <button class="btn btn-sm btn-ghost" onclick="clearChatFile()" aria-label="Remove file" style="padding: 2px 8px;">✕</button>
                    </div>
                    <div class="chat-input-wrapper">
                        <input type="file" id="chatFileInput" accept=".pdf,.txt" style="display:none;" onchange="handleChatFileUpload(event)">
                        <button class="chat-upload-btn" onclick="document.getElementById('chatFileInput').click()" title="Attach a PDF or TXT" aria-label="Attach a PDF or TXT">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <textarea
                            id="chatInput"
                            placeholder="Ask anything about books…"
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <button class="chat-send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                        </button>
                    </div>
                    <div class="chat-disclaimer">Answers can be wrong sometimes. Double-check anything important.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
