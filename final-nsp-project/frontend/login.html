<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <script>(function(){var t='dark';try{t=localStorage.getItem('vellichor_theme')||'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t);})()</script>
    <style>html{background:#100e0c;color-scheme:dark}html[data-theme="light"]{background:#f6f1e9;color-scheme:light}@view-transition{navigation:auto}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400..700&display=swap">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Log in — Vellichor</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-page">
        <!-- Left: editorial panel -->
        <aside class="auth-art" aria-hidden="true">
            <img class="auth-art-photo" src="img/library-lights.jpg" alt="">
            <a href="index.html" class="wordmark">vellichor<span class="wordmark-dot">.</span></a>
            <div class="auth-art-quote">
                <p>“We read to know<br>we are not <em>alone.</em>”</p>
                <span>— C.S. Lewis (allegedly)</span>
            </div>
        </aside>

        <!-- Right: form -->
        <main class="auth-main">
            <a href="index.html" class="wordmark auth-mobile-mark">vellichor<span class="wordmark-dot">.</span></a>
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome <em>back.</em></h1>
                    <p>Pick up right where you left off.</p>
                </div>

                <div class="auth-error" id="loginError" role="alert"></div>

                <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="input" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-field">
                            <input type="password" id="password" class="input" placeholder="Your password" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword()" id="togglePwdBtn" aria-label="Show password">
                                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">Log in</button>

                    <div class="auth-divider">or</div>

                    <a href="dashboard.html" class="btn btn-secondary btn-lg" onclick="guestLogin()">Just looking? Continue as guest</a>
                </form>

                <div class="auth-footer">
                    New here? <a href="register.html">Create an account</a>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
