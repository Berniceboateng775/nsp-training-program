<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Vellichor AI</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<script>(function(){var t=localStorage.getItem('vellichor_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue your reading journey</p>
            </div>

            <div class="auth-error" id="loginError"></div>

            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width: 100%;">
                    Sign In
                </button>

                <div class="auth-divider">or</div>

                <a href="dashboard.html" class="btn btn-secondary btn-lg" style="width: 100%;" onclick="guestLogin()">
                    Continue as Guest
                </a>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
